name: khdle
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_typeahead: ^6.0.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: PRGothIWA
      fonts:
        - asset: assets/fonts/PRGothIWA-Dm.TTF
    - family: KH-Numbers
      fonts:
        - asset: assets/fonts/KH2_ALL_MENU_I.TTF
    - family: TitanOne
      fonts:
        - asset: assets/fonts/TitanOne-Regular.ttf
    - family: ITCBenguiatStdBold
      fonts:
        - asset: assets/fonts/ITCBenguiatStdBoldCn.OTF
    - family: ScienceGothic
      fonts:
        - asset: assets/fonts/ScienceGothic.ttf
  assets:
    - assets/fonts/
    - assets/json/
    - assets/images/
    - assets/images/keyblades/
